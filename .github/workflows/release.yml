name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  PROJECT: src/OpenTapo/OpenTapo.csproj
  TESTS: tests/OpenTapo.Tests/OpenTapo.Tests.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Exact SDK: self-contained publish pulls SDK-versioned packages (ILLink) into the lock files.
          dotnet-version: 10.0.401

      # The runner image ships newer SDKs and dotnet picks the newest unless global.json says otherwise.
      - run: dotnet new globaljson --sdk-version 10.0.401 --roll-forward disable

      - run: dotnet restore ${{ env.TESTS }} --locked-mode

      - run: dotnet build ${{ env.PROJECT }} -c Release --no-restore -warnaserror

      # Unit, integration (fake devices on loopback) and fuzz tests; fails under 100 % line coverage.
      - run: dotnet test ${{ env.TESTS }} -c Release --no-restore

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish $env:PROJECT -c Release --no-restore -p:Version=$version -o publish

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) { throw 'CERT_PFX_BASE64 secret is not set' }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\OpenTapo.exe
            if ($LASTEXITCODE) { throw 'signtool sign failed' }
            & $signtool.FullName verify /pa publish\OpenTapo.exe
            if ($LASTEXITCODE) { throw 'signature verification failed' }
          } finally {
            Remove-Item $pfx -Force
          }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} publish/OpenTapo.exe --generate-notes
